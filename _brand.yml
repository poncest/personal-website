meta:
  name: "Steven Ponce Personal Website"
  link: https://stevenponce.netlify.app/
  
color:
  palette:
    primary: "#3b4252"   
    secondary: "#75b5aa"  
    light-theme: "#FFFFFF"  
    dark-theme: "#000000"   
  foreground: "#3b4252"    
  background: "#FFFFFF" 

typography:
  fonts:
    - family: Newsreader
      source: google
      weight: [400, 500, 600]
      style: [normal, italic]
