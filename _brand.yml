meta:
  name: "Steven Ponce Personal Website"
  link: https://stevenponce.netlify.app/
  
color:
  palette:
    burgundy: "#a8323f"
    ink: "#22282b"
    ink-soft: "#5c5f5b"
    paper: "#f4f1ea"
  primary: burgundy
  foreground: ink
  background: paper

typography:
  fonts:
    - family: Newsreader
      source: file
      files:
        - path: assets/fonts/newsreader-v26-latin_latin-ext-regular.woff2
          weight: 400
          style: normal
        - path: assets/fonts/newsreader-v26-latin_latin-ext-italic.woff2
          weight: 400
          style: italic
        - path: assets/fonts/newsreader-v26-latin_latin-ext-500.woff2
          weight: 500
          style: normal
        - path: assets/fonts/newsreader-v26-latin_latin-ext-500italic.woff2
          weight: 500
          style: italic
        - path: assets/fonts/newsreader-v26-latin_latin-ext-600.woff2
          weight: 600
          style: normal
        - path: assets/fonts/newsreader-v26-latin_latin-ext-600italic.woff2
          weight: 600
          style: italic
    - family: Public Sans
      source: file
      files:
        - path: assets/fonts/public-sans-v21-latin_latin-ext-regular.woff2
          weight: 400
        - path: assets/fonts/public-sans-v21-latin_latin-ext-500.woff2
          weight: 500
        - path: assets/fonts/public-sans-v21-latin_latin-ext-600.woff2
          weight: 600
        - path: assets/fonts/public-sans-v21-latin_latin-ext-700.woff2
          weight: 700
    - family: JetBrains Mono
      source: file
      files:
        - path: assets/fonts/jetbrains-mono-v24-latin_latin-ext-regular.woff2
          weight: 400
        - path: assets/fonts/jetbrains-mono-v24-latin_latin-ext-500.woff2
          weight: 500
        - path: assets/fonts/jetbrains-mono-v24-latin_latin-ext-600.woff2
          weight: 600
  base:
    family: Public Sans
    line-height: 1.6
  headings:
    family: Newsreader
    weight: 500
  monospace: JetBrains Mono
    
logo:
  medium:
    light: assets/img/sp_monogram-512.png
    dark: assets/img/sp_monogram_dark-512.png