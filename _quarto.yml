project:
  type: website
  output-dir: _site    
  resources:
    - "google0e9f05038708b3a4.html"
    - "favicon.ico"
    - "apple-touch-icon.png"
    - "assets/fonts/*.woff2"
  preview:
    port: 3434
    browser: true
    watch-inputs: true
    timeout: 3600

execute:
  cache: true
  freeze: auto
  echo: fenced  
  warning: false  
  message: false  
  fig-dpi: 96  
  fig-format: png  

website:
  title: "Steven Ponce"
  description: "Data Visualizations and R Code"
  image: "assets/img/share-card.png"     
  site-url: https://stevenponce.netlify.app/
  site-path: "/" 
  favicon: assets/img/favicon-32.png
  open-graph: true
  google-analytics: G-SG5QD2EXYM 
  twitter-card:                     
    creator: "@sponce1"
    card-style: summary_large_image
  search: true 
  repo-url: https://github.com/poncest/personal-website
  repo-branch: master   
  repo-subdir: data_visualizations
  back-to-top-navigation: true
  page-navigation: true

  navbar:
    pinned: true
    
    left: 
      - text: "About"
        file: index.qmd
      - text: "Data Visualizations"
        file: data_visualizations.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Behind the Viz"
        file: behind_the_viz.qmd
    
    right:
      - icon: file-earmark-person
        text: Resume
        href: cv/Steven_Ponce_Resume.pdf  
        target: _blank
      - icon: github
        href: https://github.com/poncest
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/stevenponce/
        aria-label: LinkedIn
      - icon: twitter-x
        href: https://twitter.com/sponce1
        aria-label: X (Twitter)
      - text: "{{< iconify fa6-brands bluesky size=1.1em title='Bluesky' >}}"
        href: https://bsky.app/profile/sponce1.bsky.social
      - icon: envelope
        text: Email
        href: mailto:steven_ponce@yahoo.com

  page-footer:
      left: "&#169; 2024–<span class='footer-year'>2026</span> Steven Ponce · Built with R + Quarto"
      center: |
        <a class="me-1" href="https://github.com/poncest" title="GitHub" aria-label="GitHub" target="_blank" rel="noopener">{{< fa brands github >}}</a>
        <a class="me-1" href="https://www.linkedin.com/in/stevenponce/" title="LinkedIn" aria-label="LinkedIn" target="_blank" rel="noopener">{{< fa brands linkedin >}}</a>
        <a class="me-1" href="https://twitter.com/sponce1" title="X/Twitter" aria-label="X (Twitter)" target="_blank" rel="noopener">{{< fa brands x-twitter >}}</a>
        <a class="me-1" href="https://bsky.app/profile/sponce1.bsky.social" title="Bluesky" aria-label="Bluesky" target="_blank" rel="noopener">{{< iconify fa6-brands bluesky >}}</a>
      right: |
        <a class="me-1" href="https://github.com/poncest/personal-website">{{< fa code >}} Source</a>
        <a class="me-1" href="https://github.com/poncest/personal-website/issues">{{< fa bug >}} Issues</a>

format:
  html:
    css: assets/styling/fonts.css
    page-layout: full
    sidebar: false
    theme: 
      light: [flatly, assets/styling/custom_styles.scss]
      dark: [darkly, assets/styling/custom_styles_dark.scss]
    toc: true
    include-in-header:
      - text: |
          <link rel="apple-touch-icon" href="/apple-touch-icon.png">
          <link rel="preload" href="/assets/fonts/newsreader-v26-latin_latin-ext-500.woff2" as="font" type="font/woff2" crossorigin>
          <link rel="preload" href="/assets/fonts/public-sans-v21-latin_latin-ext-regular.woff2" as="font" type="font/woff2" crossorigin>
      - text: |
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Steven Ponce",
            "url": "https://stevenponce.netlify.app",
            "description": "Data Visualizations and R Code",
            "author": {
              "@type": "Person",
              "name": "Steven Ponce"
            },
            "publisher": {
              "@type": "Person",
              "name": "Steven Ponce"
            }
          }
          </script>
    include-after-body:
      - text: |
          <script>
          // Listing-card thumbnails sit next to their own title, so mark them
          // decorative (alt="") unless the post sets image-alt.
          document.querySelectorAll("img.thumbnail-image:not([alt])").forEach(function (img) {
            img.setAttribute("alt", "");
          });
          // Footer copyright: keep the end year current (HTML fallback: 2026).
          document.querySelectorAll(".footer-year").forEach(function (el) {
            el.textContent = new Date().getFullYear();
          });
          </script>
    # Resource optimization
    smooth-scroll: true
    anchor-sections: true
    code-fold: show
    code-tools: false
    code-link: false  
    html-math-method: katex  # Faster than MathJax
    
     # Performance tweaks
    self-contained: false
    minimal: false
    standalone: false  # Don't include unnecessary libraries